<!doctype html>
<html>
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruiloft Roos & Maurits</title>
  
  <script src="https://cdn.jsdelivr.net/npm/add-to-calendar-button@2" async defer></script>

  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
  <body>
    <section class="logo">
      <img src="img/Logo.svg" />
    </section>

    <section class="pioenrozen">
  <div class="bovenstedeel">
    <h1>save the date</h1>
    <img class="datum" src="img/Date.svg" />
    
    <add-to-calendar-button 
      name="Bruiloft Roos Bugter en Maurits Roos"
      description="Save the date"
      startDate="2027-04-10"
      startTime="09:00"
      endDate="2027-04-10"
      endTime="23:00"
      timeZone="Europe/Amsterdam"
      location="Volgt binnenkort"
      organizer="Roos en Maurits|bruiloftroosenmaurits@gmail.com"
      options="'Apple','Google','iCal','Outlook.com'"
      label="Opslaan in Agenda"
      class="button"
    ></add-to-calendar-button>
  </div>
  
  <div class="onderstedeel">
    <p>
      Wij nodigen je hierbij graag uit om op
      <strong>10 april 2027</strong><br />
      te vieren dat Maurits Roos & Roos Bugter elkaar het ja-woord geven.
    </p>
  </div>
</section>

    <section class="vragen-en-contact">
      <h2>Vragen &amp; contact</h2>
      <p>Mail de ceremoniemeesters:<br />bruiloftroosenmaurits@gmail.com</p>
      <button class="mail">
        <a href="mailto:bruiloftroosenmaurits@gmail.com">
          <img src="img/Mail.svg" />
          <p>Mail direct</p>
        </a>
      </button>
    </section>
    <section class="footer"></section>
  </body>
</html>
